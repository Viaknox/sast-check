name: sast-check
description: >-
  PR security gate. Runs Opengrep (custom MIT rules), Ruff security rules, zizmor,
  gitleaks and osv-scanner, merges the findings and blocks on the configured severities.
author: Viaknox
branding:
  icon: shield
  color: blue

inputs:
  base:
    description: Base commit/ref to diff against. Defaults to the PR base SHA.
    default: ${{ github.event.pull_request.base.sha }}
  mode:
    description: "diff (only changed lines can block) or full. Empty = use .sast-check.toml / default (diff)."
    default: ""
  comment:
    description: Post/update one sticky PR comment with the report (skipped on fork PRs).
    default: "true"
  fail:
    description: Fail the job when the verdict is fail/error. Set "false" for report-only.
    default: "true"
  github-token:
    description: Token for the PR comment and zizmor online audits.
    default: ${{ github.token }}

outputs:
  verdict:
    description: pass | fail | error
    value: ${{ steps.scan.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Check runner
      shell: bash
      run: |
        if [ "$RUNNER_OS" != "Linux" ] || [ "$RUNNER_ARCH" != "X64" ]; then
          echo "::error::sast-check v1 supports Linux x64 runners only"; exit 1
        fi

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install scanners (pinned)
      shell: bash
      env:
        OPENGREP_VERSION: v1.30.2
      run: |
        set -euo pipefail
        # a transient registry error must not fail every PR: three tries, then fail (closed)
        retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i: $*" >&2; sleep $((i * 10)); done; return 1; }
        retry python -I -m pip install --quiet --disable-pip-version-check --timeout 60 "ruff==0.16.8" "zizmor==1.30.1"
        # go install verifies module content against the public Go checksum database
        retry go install github.com/zricethezav/gitleaks/v8@v8.30.1
        retry go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0

        # Opengrep: download and verify the Sigstore signature before use
        d="$RUNNER_TEMP/opengrep"; mkdir -p "$d"
        base="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 -o "$d/opengrep" "$base"
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 -o "$d/opengrep.sig" "$base.sig"
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 -o "$d/opengrep.cert" "$base.cert"
        cosign verify-blob --cert "$d/opengrep.cert" --signature "$d/opengrep.sig" \
          --certificate-identity-regexp "^https://github.com/opengrep/opengrep/" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$d/opengrep"
        chmod +x "$d/opengrep"

    - name: Scan
      id: scan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SAST_BASE: ${{ inputs.base }}
        SAST_MODE: ${{ inputs.mode }}
      run: |
        set +e
        export PATH="$RUNNER_TEMP/opengrep:$(go env GOPATH)/bin:$PATH"
        args=(--repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/sast-results")
        [ -n "$SAST_BASE" ] && args+=(--base "$SAST_BASE")
        [ -n "$SAST_MODE" ] && args+=(--mode "$SAST_MODE")
        python -I "$GITHUB_ACTION_PATH/scripts/sast.py" "${args[@]}" > /dev/null
        code=$?
        verdict=$(python -I -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RUNNER_TEMP/sast-results/findings.json" 2>/dev/null || echo error)
        cat "$RUNNER_TEMP/sast-results/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "sast-check crashed (exit $code)" >> "$GITHUB_STEP_SUMMARY"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF (read by the learner agent)
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sast-check-sarif
        path: ${{ runner.temp }}/sast-results/results.sarif
        if-no-files-found: warn
        retention-days: 90

    - name: PR comment
      if: ${{ inputs.comment == 'true' && github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: bash "$GITHUB_ACTION_PATH/scripts/comment.sh" "$RUNNER_TEMP/sast-results/report.md"

    - name: Enforce
      if: ${{ inputs.fail == 'true' && steps.scan.outputs.code != '0' }}
      shell: bash
      env:
        VERDICT: ${{ steps.scan.outputs.verdict }}
      run: |
        echo "::error::sast-check verdict: $VERDICT (see job summary)"
        exit 1
