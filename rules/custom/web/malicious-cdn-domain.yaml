rules:
  - id: sast.web.malicious-cdn-domain
    languages: [generic]
    severity: ERROR
    message: >-
      This code references a CDN domain that is known to serve, or to have served, malicious
      code (for example polyfill.io, which started injecting malware into sites in the 2024
      supply-chain incident). Remove the reference, self-host the files, or use a trusted
      mirror such as cdnjs or Fastly's polyfill service.
    metadata:
      sast_severity: critical
      confidence: high
      cwe: "CWE-829"
      category: security
      fix: "Self-host the library, or switch to a trusted mirror (cdnjs.cloudflare.com, or the Fastly polyfill service) and pin it with Subresource Integrity."
      references:
        - https://www.censys.com/blog/july-2-polyfill-io-supply-chain-attack-digging-into-the-web-of-compromised-domains
        - https://cwe.mitre.org/data/definitions/829.html
    paths:
      # only files a browser or server loads: a URL in docs (README.md, an incident note) cannot run
      include:
        - "*.html"
        - "*.htm"
        - "*.xhtml"
        - "*.js"
        - "*.mjs"
        - "*.cjs"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.vue"
        - "*.svelte"
        - "*.astro"
        - "*.ejs"
        - "*.hbs"
        - "*.handlebars"
        - "*.njk"
        - "*.liquid"
        - "*.twig"
        - "*.jinja"
        - "*.j2"
        - "*.erb"
        - "*.php"
        - "*.jsp"
        - "*.aspx"
        - "*.cshtml"
        - "*.css"
        - "*.scss"
      exclude:
        - node_modules
    # Match the host only where something loads it: src/href attributes, CSS url() and @import, JS import/fetch/loaders,
    # or a URL string assigned to a variable. A bare host in a deny-list array, a comment or a comparison is not a load.
    # A browser canonicalises the host, so percent-encoded letters (%70olyfill.io), upper case and a trailing dot are matched too.
    pattern-either:
      # attributes that load a file
      - pattern-regex: '(?i)(?:\b(?:src|href|srcset|imagesrcset|data|data-src|data-href|poster|background|action|formaction|xlink:href)[ \t\r\n]*=[ \t\r\n]*\{?[ \t]*["''`]?[ 	]*)(?:https?:)?[/\\]{2}(?:(?:[a-z0-9-]|%[0-9a-f]{2})+(?:\.|%2e))*(?:(?:p|%70|%50)(?:o|%6f|%4f)(?:l|%6c|%4c)(?:y|%79|%59)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:l|%6c|%4c)(?:\.|%2e)(?:i|%69|%49)(?:o|%6f|%4f)|(?:p|%70|%50)(?:o|%6f|%4f)(?:l|%6c|%4c)(?:y|%79|%59)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:l|%6c|%4c)(?:\.|%2e)(?:c|%63|%43)(?:o|%6f|%4f)(?:m|%6d|%4d)|(?:b|%62|%42)(?:s|%73|%53)(?:c|%63|%43)(?:l|%6c|%4c)(?:i|%69|%49)(?:n|%6e|%4e)(?:k|%6b|%4b)(?:\.|%2e)(?:c|%63|%43)(?:n|%6e|%4e)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:d|%64|%44)(?:n|%6e|%4e)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:s|%73|%53)(?:s|%73|%53)(?:\.|%2e)(?:c|%63|%43)(?:o|%6f|%4f)(?:m|%6d|%4d)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:s|%73|%53)(?:s|%73|%53)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:s|%73|%53)(?:t|%74|%54)(?:a|%61|%41)(?:t|%74|%54)(?:i|%69|%49)(?:c|%63|%43)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:e|%65|%45)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:s|%73|%53)(?:t|%74|%54)(?:a|%61|%41)(?:t|%74|%54)(?:i|%69|%49)(?:c|%63|%43)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:e|%65|%45)(?:\.|%2e)(?:o|%6f|%4f)(?:r|%72|%52)(?:g|%67|%47))(?:\.|%2e)?(?=[/:?#\\\"''`\s)>,;]|%2f|%3a|%3f|%23|$)'
      # CSS url() and @import
      - pattern-regex: '(?i)(?:(?:\burl\([ \t\r\n]*["''`]?|@import[ \t\r\n]+["''`])[ 	]*)(?:https?:)?[/\\]{2}(?:(?:[a-z0-9-]|%[0-9a-f]{2})+(?:\.|%2e))*(?:(?:p|%70|%50)(?:o|%6f|%4f)(?:l|%6c|%4c)(?:y|%79|%59)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:l|%6c|%4c)(?:\.|%2e)(?:i|%69|%49)(?:o|%6f|%4f)|(?:p|%70|%50)(?:o|%6f|%4f)(?:l|%6c|%4c)(?:y|%79|%59)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:l|%6c|%4c)(?:\.|%2e)(?:c|%63|%43)(?:o|%6f|%4f)(?:m|%6d|%4d)|(?:b|%62|%42)(?:s|%73|%53)(?:c|%63|%43)(?:l|%6c|%4c)(?:i|%69|%49)(?:n|%6e|%4e)(?:k|%6b|%4b)(?:\.|%2e)(?:c|%63|%43)(?:n|%6e|%4e)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:d|%64|%44)(?:n|%6e|%4e)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:s|%73|%53)(?:s|%73|%53)(?:\.|%2e)(?:c|%63|%43)(?:o|%6f|%4f)(?:m|%6d|%4d)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:s|%73|%53)(?:s|%73|%53)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:s|%73|%53)(?:t|%74|%54)(?:a|%61|%41)(?:t|%74|%54)(?:i|%69|%49)(?:c|%63|%43)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:e|%65|%45)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:s|%73|%53)(?:t|%74|%54)(?:a|%61|%41)(?:t|%74|%54)(?:i|%69|%49)(?:c|%63|%43)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:e|%65|%45)(?:\.|%2e)(?:o|%6f|%4f)(?:r|%72|%52)(?:g|%67|%47))(?:\.|%2e)?(?=[/:?#\\\"''`\s)>,;]|%2f|%3a|%3f|%23|$)'
      # JS import / fetch / loaders / .src =
      - pattern-regex: '(?i)(?:(?:\b(?:from|import)[ \t\r\n]*["''`]|\b(?:import|require|fetch|importScripts|getScript|\w*(?:load|Load|inject|Inject|append|Append|add|Add)\w*(?:Script|Style|Stylesheet|JS|Js|CSS|Css|Module)s?)[ \t\r\n]*\([ \t\r\n]*["''`]|\.(?:src|href)[ \t]*=(?!=)[ \t]*["''`]|setAttribute\([ \t]*[\"''](?:src|href)[\"''][ \t]*,[ \t]*["''`])[ 	]*)(?:https?:)?[/\\]{2}(?:(?:[a-z0-9-]|%[0-9a-f]{2})+(?:\.|%2e))*(?:(?:p|%70|%50)(?:o|%6f|%4f)(?:l|%6c|%4c)(?:y|%79|%59)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:l|%6c|%4c)(?:\.|%2e)(?:i|%69|%49)(?:o|%6f|%4f)|(?:p|%70|%50)(?:o|%6f|%4f)(?:l|%6c|%4c)(?:y|%79|%59)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:l|%6c|%4c)(?:\.|%2e)(?:c|%63|%43)(?:o|%6f|%4f)(?:m|%6d|%4d)|(?:b|%62|%42)(?:s|%73|%53)(?:c|%63|%43)(?:l|%6c|%4c)(?:i|%69|%49)(?:n|%6e|%4e)(?:k|%6b|%4b)(?:\.|%2e)(?:c|%63|%43)(?:n|%6e|%4e)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:d|%64|%44)(?:n|%6e|%4e)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:s|%73|%53)(?:s|%73|%53)(?:\.|%2e)(?:c|%63|%43)(?:o|%6f|%4f)(?:m|%6d|%4d)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:s|%73|%53)(?:s|%73|%53)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:s|%73|%53)(?:t|%74|%54)(?:a|%61|%41)(?:t|%74|%54)(?:i|%69|%49)(?:c|%63|%43)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:e|%65|%45)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:s|%73|%53)(?:t|%74|%54)(?:a|%61|%41)(?:t|%74|%54)(?:i|%69|%49)(?:c|%63|%43)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:e|%65|%45)(?:\.|%2e)(?:o|%6f|%4f)(?:r|%72|%52)(?:g|%67|%47))(?:\.|%2e)?(?=[/:?#\\\"''`\s)>,;]|%2f|%3a|%3f|%23|$)'
      # a URL string assigned to a variable or property
      - pattern-regex: '(?i)(?:(?:(?<![=!<>])=(?!=)|:)[ \t]*["''`][ 	]*)(?:https?:)?[/\\]{2}(?:(?:[a-z0-9-]|%[0-9a-f]{2})+(?:\.|%2e))*(?:(?:p|%70|%50)(?:o|%6f|%4f)(?:l|%6c|%4c)(?:y|%79|%59)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:l|%6c|%4c)(?:\.|%2e)(?:i|%69|%49)(?:o|%6f|%4f)|(?:p|%70|%50)(?:o|%6f|%4f)(?:l|%6c|%4c)(?:y|%79|%59)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:l|%6c|%4c)(?:\.|%2e)(?:c|%63|%43)(?:o|%6f|%4f)(?:m|%6d|%4d)|(?:b|%62|%42)(?:s|%73|%53)(?:c|%63|%43)(?:l|%6c|%4c)(?:i|%69|%49)(?:n|%6e|%4e)(?:k|%6b|%4b)(?:\.|%2e)(?:c|%63|%43)(?:n|%6e|%4e)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:d|%64|%44)(?:n|%6e|%4e)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:s|%73|%53)(?:s|%73|%53)(?:\.|%2e)(?:c|%63|%43)(?:o|%6f|%4f)(?:m|%6d|%4d)|(?:b|%62|%42)(?:o|%6f|%4f)(?:o|%6f|%4f)(?:t|%74|%54)(?:c|%63|%43)(?:s|%73|%53)(?:s|%73|%53)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:s|%73|%53)(?:t|%74|%54)(?:a|%61|%41)(?:t|%74|%54)(?:i|%69|%49)(?:c|%63|%43)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:e|%65|%45)(?:\.|%2e)(?:n|%6e|%4e)(?:e|%65|%45)(?:t|%74|%54)|(?:s|%73|%53)(?:t|%74|%54)(?:a|%61|%41)(?:t|%74|%54)(?:i|%69|%49)(?:c|%63|%43)(?:f|%66|%46)(?:i|%69|%49)(?:l|%6c|%4c)(?:e|%65|%45)(?:\.|%2e)(?:o|%6f|%4f)(?:r|%72|%52)(?:g|%67|%47))(?:\.|%2e)?(?=[/:?#\\\"''`\s)>,;]|%2f|%3a|%3f|%23|$)'
