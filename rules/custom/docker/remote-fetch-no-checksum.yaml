rules:
  - id: sast.docker.remote-fetch-no-checksum
    languages: [dockerfile]
    severity: WARNING
    message: >-
      This Dockerfile step pulls something from the network and trusts it blindly: an ADD of
      a URL with no --checksum, a download piped into a shell, or a downloaded archive or
      binary that is unpacked or run with no hash check in the same RUN. A tampered download
      ends up inside your image. Pin a sha256 (ADD --checksum=sha256:..., or sha256sum -c).
    metadata:
      sast_severity: medium
      confidence: medium
      cwe: "CWE-494"
      category: security
      fix: "Use ADD --checksum=sha256:<digest> URL dest, or download to a file and run sha256sum -c before extracting or executing."
      references:
        - https://cwe.mitre.org/data/definitions/494.html
        - https://docs.docker.com/reference/dockerfile/#add
    pattern-either:
      - patterns:
          - pattern-regex: '(?mi)^[ \t]*ADD[ \t]+(?P<FLAGS>(?:--\S+[ \t]+)*)https?://\S+'
          - metavariable-regex:
              metavariable: $FLAGS
              regex: '(?is)^(?!.*--checksum).*$'
      - patterns:
          - pattern-regex: '(?mi)^[ \t]*RUN[ \t]+(?P<CMD>(?:[^\n\\]|\\\r?\n|\\.)*)'
          - metavariable-regex:
              metavariable: $CMD
              # pipe into an interpreter, or process/command substitution fed to sh -c, eval, source or `.`; `python -m json.tool` only pretty-prints
              regex: '(?s).*(?:\b(?:curl|wget)\b[^\n|]*\|[ \t]*(?:sudo[ \t]+(?:-[A-Za-z]+[ \t]+)*)?(?:(?:ba|z|da|k)?sh|python[0-9.]*|node|perl|ruby)\b(?![ \t]+-m[ \t]+json\.tool)|(?:\b(?:(?:ba|z|da|k)?sh|source|eval)\b[ \t]+(?:-[A-Za-z]+[ \t]+)*[\"'']?(?:<\((?:curl|wget)\b|\$\((?:curl|wget)\b[^)]*\))|(?:^|[\s;&|])\.[ \t]+[\"'']?(?:<\(|\$\()(?:curl|wget)\b)).*'
      - patterns:
          - pattern-regex: '(?mi)^[ \t]*RUN[ \t]+(?P<CMD>(?:[^\n\\]|\\\r?\n|\\.)*)'
          - metavariable-regex:
              metavariable: $CMD
              # A "verification" is a real check: sha*sum / shasum with -c or --check, a signature tool, or a
              # computed hash compared on the same line ([ ], test, grep, diff, cmp); a printed hash does not
              # count. Fires when (1) nothing is verified, (2) a file saved with -o/-O is never named on a
              # line that verifies it, or (3) a download is extracted or run before any verification follows.
              regex: '(?s)^(?:(?!.*(?:(?:sha(?:1|224|256|384|512)sum|b2sum|shasum)\b[^\n]*[ \t](?:-[A-Za-z]*c[A-Za-z]*|--check)\b|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|minisign[ \t]+-V|openssl[ \t]+dgst\b(?=[^\n]*[ \t]-verify[ \t])(?=[^\n]*[ \t]-signature[ \t])|(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b[^\n]*(?:\|[ \t]*(?:diff|cmp)\b|\|[ \t]*grep\b[^\n|]*(?:\$|\b[0-9a-fA-F]{32,}\b)|\b(?:diff|cmp|test)\b|\[\[?[ \t]|==)|(?:\[\[?[ \t]|\btest\b|\bdiff\b|\bcmp\b|==)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b|\bgrep\b[^\n]*(?:\$|\b[0-9a-fA-F]{32,}\b)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b)).*|.*?(?:\bcurl\b[^\n|]*?[ \t](?:-[A-Za-z]*o|--output)[ \t]*|\bwget\b[^\n|]*?[ \t]-[A-Za-z]*O[ \t]*)(?P<F>[^\s;&|''\"\\]+)(?!(?=[^\n]*?(?:(?:sha(?:1|224|256|384|512)sum|b2sum|shasum)\b[^\n]*[ \t](?:-[A-Za-z]*c[A-Za-z]*|--check)\b|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|minisign[ \t]+-V|openssl[ \t]+dgst\b(?=[^\n]*[ \t]-verify[ \t])(?=[^\n]*[ \t]-signature[ \t])|(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b[^\n]*(?:\|[ \t]*(?:diff|cmp)\b|\|[ \t]*grep\b[^\n|]*(?:\$|\b[0-9a-fA-F]{32,}\b)|\b(?:diff|cmp|test)\b|\[\[?[ \t]|==)|(?:\[\[?[ \t]|\btest\b|\bdiff\b|\bcmp\b|==)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b|\bgrep\b[^\n]*(?:\$|\b[0-9a-fA-F]{32,}\b)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b))|.*\n(?=[^\n]*(?P=F))(?=[^\n]*?(?:(?:sha(?:1|224|256|384|512)sum|b2sum|shasum)\b[^\n]*[ \t](?:-[A-Za-z]*c[A-Za-z]*|--check)\b|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|minisign[ \t]+-V|openssl[ \t]+dgst\b(?=[^\n]*[ \t]-verify[ \t])(?=[^\n]*[ \t]-signature[ \t])|(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b[^\n]*(?:\|[ \t]*(?:diff|cmp)\b|\|[ \t]*grep\b[^\n|]*(?:\$|\b[0-9a-fA-F]{32,}\b)|\b(?:diff|cmp|test)\b|\[\[?[ \t]|==)|(?:\[\[?[ \t]|\btest\b|\bdiff\b|\bcmp\b|==)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b|\bgrep\b[^\n]*(?:\$|\b[0-9a-fA-F]{32,}\b)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b))).*|.*?\b(?:curl|wget)\b(?:(?!(?:(?:sha(?:1|224|256|384|512)sum|b2sum|shasum)\b[^\n]*[ \t](?:-[A-Za-z]*c[A-Za-z]*|--check)\b|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|minisign[ \t]+-V|openssl[ \t]+dgst\b(?=[^\n]*[ \t]-verify[ \t])(?=[^\n]*[ \t]-signature[ \t])|(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b[^\n]*(?:\|[ \t]*(?:diff|cmp)\b|\|[ \t]*grep\b[^\n|]*(?:\$|\b[0-9a-fA-F]{32,}\b)|\b(?:diff|cmp|test)\b|\[\[?[ \t]|==)|(?:\[\[?[ \t]|\btest\b|\bdiff\b|\bcmp\b|==)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b|\bgrep\b[^\n]*(?:\$|\b[0-9a-fA-F]{32,}\b)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b)).)*?(?:[;&|(]|\n)[ \t]*(?:\\\r?\n[ \t]*)*(?:sudo[ \t]+(?:-[A-Za-z]+[ \t]+)*)?(?:tar|unzip|gunzip|bunzip2|unxz|7za?|dpkg|rpm|\./\S+|(?:ba|z|da|k)?sh|source|python[0-9.]*|node|perl|ruby)(?=[ \t\n\\]|$).*)$'
          - metavariable-regex:
              metavariable: $CMD
              regex: '(?s).*(?:\bcurl\b[^\n|]*[ \t](?:-[A-Za-z]*[oO]\b|--output\b|--remote-name\b)|\bwget\b[ \t]+(?![^\n]*(?:--spider|-[A-Za-z]*O[ \t]*-))).*https?://.*'
          - metavariable-regex:
              metavariable: $CMD
              regex: '(?s).*(?:\btar\b|\bunzip\b|\bgunzip\b|\bbunzip2\b|\bchmod\b|\bdpkg[ \t]+-i\b|\brpm[ \t]+-i\b|\bsh[ \t]|\bbash[ \t]|[ \t;&]\./).*'
          - metavariable-regex:
              metavariable: $CMD
              regex: '(?s)^(?!.*\|[ \t]*(?:sudo[ \t]+)?(?:(?:ba|z|da|k)?sh|python[0-9.]*|node|perl|ruby)\b(?![ \t]+-m[ \t]+json\.tool)).*'
