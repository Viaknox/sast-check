rules:
  - id: sast.terraform.aws-ami-no-owner
    languages: [terraform]
    severity: ERROR
    message: >-
      This aws_ami data source picks the newest matching image but never says who must own
      it. Anyone can publish a public AMI with the same name, so Terraform may launch an
      attacker's image in your account. Set owners (an account ID or "amazon" / "self"), or
      filter on owner-id.
    metadata:
      sast_severity: critical
      confidence: high
      cwe: "CWE-829"
      category: security
      fix: "Add owners = [\"<account-id>\"] (or \"amazon\", \"self\") to the data \"aws_ami\" block."
      references:
        - https://cwe.mitre.org/data/definitions/829.html
        - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/data-sources/ami
    # Structural branch: no owner at all, or an owner given by something Terraform cannot resolve here (kept quiet).
    # Regex branches: an owner given by var.X / local.X whose value in THIS file is an empty list ([]), which
    # restricts nothing. A variable without a default, or with a non-empty default, stays quiet. Assumes formatted
    # code (a top-level block closes with a brace at column 0). module.* outputs cannot be resolved in one file.
    pattern-either:
      - patterns:
          - pattern: |
              data "aws_ami" "$NAME" {
                ...
                most_recent = true
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                owners = [$O, ...]
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                filter {
                  ...
                  name = "owner-id"
                  ...
                  values = [$V, ...]
                  ...
                }
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                filter {
                  ...
                  name = "owner-alias"
                  ...
                  values = [$V, ...]
                  ...
                }
                ...
              }
          # an owner restriction given by reference (variable, local, module output) is still a restriction
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                owners = var.$X
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                owners = local.$X
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                owners = module.$M.$X
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                filter {
                  ...
                  name = "owner-id"
                  ...
                  values = var.$X
                  ...
                }
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                filter {
                  ...
                  name = "owner-id"
                  ...
                  values = local.$X
                  ...
                }
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                filter {
                  ...
                  name = "owner-id"
                  ...
                  values = module.$M.$X
                  ...
                }
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                filter {
                  ...
                  name = "owner-alias"
                  ...
                  values = var.$X
                  ...
                }
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                filter {
                  ...
                  name = "owner-alias"
                  ...
                  values = local.$X
                  ...
                }
                ...
              }
          - pattern-not: |
              data "aws_ami" "$NAME" {
                ...
                filter {
                  ...
                  name = "owner-alias"
                  ...
                  values = module.$M.$X
                  ...
                }
                ...
              }
      # var default is an empty list, defined before the data source
      - patterns:
          - pattern-regex: '(?s)\bvariable[ \t]+"(?P<V>[A-Za-z_][\w-]*)"[ \t]*\{(?!(?:(?!\n\}).)*?\bcondition[ \t]*=[ \t]*length\(var\.(?P=V)\)[ \t]*(?:>[ \t]*0|>=[ \t]*1|!=[ \t]*0)\b(?![^\n]*\|\|))(?:(?!\n\}).)*?\bdefault[ \t]*=[ \t]*\[[ \t\r\n]*\](?:(?!\n\}).)*\n\}.*?(?P<D>data[ \t]+"aws_ami"[ \t]+"[^"]+")[ \t]*\{(?=(?:(?!\n\}).)*?\bmost_recent[ \t]*=[ \t]*true\b)(?!(?:(?!\n\}).)*?\bname[ \t]*=[ \t]*\"owner-)(?=(?:(?!\n\}).)*?\bowners[ \t]*=[ \t]*var\.(?P=V)(?![\w.\[-]))'
          - focus-metavariable: $D
      # var default is an empty list, defined after the data source
      - pattern-regex: '(?s)(?P<D>data[ \t]+"aws_ami"[ \t]+"[^"]+")[ \t]*\{(?=(?:(?!\n\}).)*?\bmost_recent[ \t]*=[ \t]*true\b)(?!(?:(?!\n\}).)*?\bname[ \t]*=[ \t]*\"owner-)(?=(?:(?!\n\}).)*?\bowners[ \t]*=[ \t]*var\.(?P<V>[A-Za-z_][\w-]*)(?![\w.\[-]))(?=(?:(?!\n\}).)*?\n\}.*?\bvariable[ \t]+"(?P=V)"[ \t]*\{(?!(?:(?!\n\}).)*?\bcondition[ \t]*=[ \t]*length\(var\.(?P=V)\)[ \t]*(?:>[ \t]*0|>=[ \t]*1|!=[ \t]*0)\b(?![^\n]*\|\|))(?:(?!\n\}).)*?\bdefault[ \t]*=[ \t]*\[[ \t\r\n]*\](?:(?!\n\}).)*\n\})'
      # local default is an empty list, defined before the data source
      - patterns:
          - pattern-regex: '(?s)\blocals[ \t]*\{(?:(?!\n\}).)*?\b(?P<V>[A-Za-z_][\w-]*)[ \t]*=[ \t]*\[[ \t\r\n]*\](?:(?!\n\}).)*\n\}.*?(?P<D>data[ \t]+"aws_ami"[ \t]+"[^"]+")[ \t]*\{(?=(?:(?!\n\}).)*?\bmost_recent[ \t]*=[ \t]*true\b)(?!(?:(?!\n\}).)*?\bname[ \t]*=[ \t]*\"owner-)(?=(?:(?!\n\}).)*?\bowners[ \t]*=[ \t]*local\.(?P=V)(?![\w.\[-]))'
          - focus-metavariable: $D
      # local default is an empty list, defined after the data source
      - pattern-regex: '(?s)(?P<D>data[ \t]+"aws_ami"[ \t]+"[^"]+")[ \t]*\{(?=(?:(?!\n\}).)*?\bmost_recent[ \t]*=[ \t]*true\b)(?!(?:(?!\n\}).)*?\bname[ \t]*=[ \t]*\"owner-)(?=(?:(?!\n\}).)*?\bowners[ \t]*=[ \t]*local\.(?P<V>[A-Za-z_][\w-]*)(?![\w.\[-]))(?=(?:(?!\n\}).)*?\n\}.*?\blocals[ \t]*\{(?:(?!\n\}).)*?\b(?P=V)[ \t]*=[ \t]*\[[ \t\r\n]*\](?:(?!\n\}).)*\n\})'
