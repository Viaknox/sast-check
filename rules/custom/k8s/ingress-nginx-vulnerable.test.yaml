# Image fields only: comments, deny-lists and prose that name an old build are not deployments
policy:
  # ok: sast.k8s.ingress-nginx-vulnerable
  # upgraded away from registry.k8s.io/ingress-nginx/controller:v1.9.4 last quarter
  deniedImages:
    # ok: sast.k8s.ingress-nginx-vulnerable
    - registry.k8s.io/ingress-nginx/controller:v1.10.1
    # ok: sast.k8s.ingress-nginx-vulnerable
    - "k8s.gcr.io/ingress-nginx/controller:v0.49.3"
  # ok: sast.k8s.ingress-nginx-vulnerable
  blocked: ["registry.k8s.io/ingress-nginx/controller:v1.11.4"]
  # ok: sast.k8s.ingress-nginx-vulnerable
  note: "never run quay.io/kubernetes-ingress-controller/nginx-ingress-controller:0.49.3 again"
---
spec:
  containers:
    # ruleid: sast.k8s.ingress-nginx-vulnerable
    - { name: a, image: registry.k8s.io/ingress-nginx/controller:v1.9.4 }
