rules:
  - id: sast.python.django-httpresponse-xss
    languages: [python]
    severity: ERROR
    message: >-
      Request data (GET, POST, cookies, headers or body) is placed straight into an
      HttpResponse body. HttpResponse defaults to text/html and does no escaping, so a crafted
      value runs as script in the visitor's browser. Escape it first or render a template.
    metadata:
      sast_severity: high
      confidence: high
      cwe: "CWE-79"
      category: security
      fix: "Wrap the value with django.utils.html.escape(), build markup with format_html(), or use a template that auto-escapes."
      references:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://owasp.org/www-community/attacks/xss/
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.GET
              - pattern: request.POST
              - pattern: request.COOKIES
              - pattern: request.META
              - pattern: request.headers
              - pattern: request.body
              - pattern: request.FILES
      # a view's request parameter can have any name: the first parameter of a function
      # (or the one after self in a method) whose Django-only request attributes are read
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $A
              regex: '^(GET|POST|COOKIES|META|FILES)$'
          - pattern-either:
              - pattern-inside: |
                  def $F($R, ...): ...
              - pattern-inside: |
                  def $F(self, $R, ...): ...
      # body and headers are common attribute names elsewhere, so they only count for
      # functions that carry a Django view decorator
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $A
              regex: '^(body|headers)$'
          - pattern-inside: |
              @$D
              def $F($R, ...): ...
          - metavariable-regex:
              metavariable: $D
              regex: '(^|\.)(require_(GET|POST|safe|http_methods)|csrf_exempt|csrf_protect|ensure_csrf_cookie|login_required|permission_required|user_passes_test|api_view|never_cache|cache_page)$'
    pattern-sanitizers:
      - pattern: django.utils.html.escape(...)
      - pattern: escape(...)
      - pattern: conditional_escape(...)
      - pattern: django.utils.html.conditional_escape(...)
      # format_html is only safe with a fixed format string: a literal or a constant bound to one
      - patterns:
          - pattern: $FH("...", ...)
          - metavariable-regex:
              metavariable: $FH
              regex: '^(django\.utils\.html\.)?format_html$'
      # Template autoescapes variables; only a literal template source counts
      - pattern: Template("...").render(...)
      - patterns:
          - pattern: $T.render(...)
          - pattern-inside: |
              $T = Template("...")
              ...
      - pattern: int(...)
      - pattern: float(...)
      - pattern: bool(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: HttpResponse($X, ...)
              - pattern: HttpResponse(..., content=$X, ...)
              - pattern: django.http.HttpResponse($X, ...)
          - pattern-not:
              patterns:
                - pattern: HttpResponse(..., content_type=$CT, ...)
                - metavariable-regex:
                    metavariable: $CT
                    regex: '^f?["'']((text/plain)|(application/json))'
          - focus-metavariable: $X
      # body-carrying HttpResponse subclasses (same text/html default)
      - patterns:
          - pattern: $C($X, ...)
          - metavariable-regex:
              metavariable: $C
              regex: '^(django\.http\.)?HttpResponse(BadRequest|NotFound|Forbidden|ServerError|Gone|NotAllowed)$'
          - pattern-not:
              patterns:
                - pattern: $C(..., content_type=$CT, ...)
                - metavariable-regex:
                    metavariable: $CT
                    regex: '^f?["'']((text/plain)|(application/json))'
          - focus-metavariable: $X
      # marking request data as safe HTML disables escaping wherever it is later rendered
      - patterns:
          - pattern-either:
              - pattern: mark_safe($X)
              - pattern: SafeString($X)
              - pattern: django.utils.safestring.mark_safe($X)
              - pattern: django.utils.safestring.SafeString($X)
          - focus-metavariable: $X
