rules:
  - id: sast.js.ejs-unescaped
    languages: [generic]
    severity: ERROR
    message: >-
      The EJS tag <%- prints its value without HTML escaping. If the value holds user or
      database content, it is an XSS hole. Use <%= value %> so it is escaped, and keep <%- for
      include() and pre-sanitized markup only.
    metadata:
      sast_severity: high
      confidence: medium
      cwe: "CWE-79"
      category: security
      fix: "Change <%- x %> to <%= x %>, or sanitize x on the server before printing it unescaped."
      references:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://ejs.co/#docs
    paths:
      include:
        - "*.ejs"
    pattern-either:
      # expressions: a sanitizer only counts as a call at the start of the expression, never as part of an identifier
      - pattern-regex: >-
          (?i)<%-(?!\s*include\s*\()(?!\s*[\w$]+\s*-?%>)(?!\s*(?:'[^']*'|"[^"]*")\s*-?%>)(?!\s*(?:[\w$]+\.)*(?:sanitize|purify|escapeHtml)\s*\()\s*[^\s%][^%]*%>
      # a bare name is fine when this template itself set it, ending in a semicolon, from a string literal or from include() of a literal path
      - patterns:
          - pattern-either:
              - pattern: <%- $X %>
              - pattern: <%- $X -%>
          - metavariable-regex:
              metavariable: $X
              regex: (?i)^(?!body$)[a-z_$][\w$]*$
          - pattern-not-inside: |
              $X = "...";
              ...
              <%- $X %>
          - pattern-not-inside: |
              $X = "...";
              ...
              <%- $X -%>
          - pattern-not-inside: |
              $X = '...';
              ...
              <%- $X %>
          - pattern-not-inside: |
              $X = '...';
              ...
              <%- $X -%>
          - pattern-not-inside: |
              $X = include('...');
              ...
              <%- $X %>
          - pattern-not-inside: |
              $X = include('...');
              ...
              <%- $X -%>
          - pattern-not-inside: |
              $X = include("...");
              ...
              <%- $X %>
          - pattern-not-inside: |
              $X = include("...");
              ...
              <%- $X -%>
      # the name was set from something other than a literal, and not set again before it is printed:
      # a literal set earlier does not make this print safe (the regex range runs from the non-literal
      # assignment to the last print before the next assignment, so every such print is inside it)
      - patterns:
          - pattern-either:
              - pattern: <%- $X %>
              - pattern: <%- $X -%>
          - pattern-regex: >-
              (?s)<%\s*(?:(?:var|let|const)\s+)?([A-Za-z_$][\w$]*)\s*=(?!=)(?!\s*(?:'[^'\n]*'|"[^"\n]*")\s*;\s*%>)(?!\s*include\s*\(\s*(?:'[^'\n]*'|"[^"\n]*")\s*(?:,\s*\{[^{}]*\}\s*)?\)\s*;\s*%>)[^;]*;\s*%>(?:(?!<%\s*(?:(?:var|let|const)\s+)?\1\s*=(?!=)).)*<%-\s*\1\s*-?%>
