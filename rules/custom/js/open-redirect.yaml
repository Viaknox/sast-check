rules:
  - id: sast.js.open-redirect
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request-controlled data decides where the response redirects the browser. Attackers can use your domain in phishing links that bounce victims to a malicious site. Accept only relative paths or allow-listed hosts.
    metadata:
      sast_severity: high
      confidence: medium
      cwe: "CWE-601"
      category: security
      fix: 'Redirect only to relative paths or to hosts on an allow-list, or map a short key to a fixed destination.'
      references:
        - https://cwe.mitre.org/data/definitions/601.html
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    mode: taint
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern: req.cookies
      - pattern: req.url
      - pattern: req.originalUrl
      - pattern: req.path
      - pattern: req.get(...)
      - pattern: req.header(...)
      - pattern: req.param(...)
      - pattern: req.signedCookies
      - pattern: req.files
      - pattern: request.query
      - pattern: request.body
      - pattern: request.params
      - pattern: request.headers
      - pattern: request.cookies
      # the handler's own request parameter, whatever it is named: (r, res) => eval(r.query.x)
      - patterns:
          - pattern-either:
              - pattern-inside: $APP.$M($P, ..., ($REQ, $RES, ...) => { ... })
              - pattern-inside: $APP.$M($P, ..., async ($REQ, $RES, ...) => { ... })
              - pattern-inside: $APP.$M($P, ..., function ($REQ, $RES, ...) { ... })
              - pattern-inside: $APP.$M($P, ..., async function ($REQ, $RES, ...) { ... })
          - metavariable-regex:
              metavariable: $M
              regex: '^(get|post|put|patch|delete|all|use|head|options)$'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
      - pattern: ctx.query
      - pattern: ctx.request.query
      - pattern: ctx.headers
      - pattern: ctx.cookies.get(...)
      - pattern: ctx.request.body
      - pattern: ctx.params
      - pattern: $U.searchParams.get(...)
      - pattern: location.search
      - pattern: location.hash
    pattern-sanitizers:
      - patterns:
          - pattern: $P + $X
          - metavariable-regex:
              metavariable: $P
              regex: '^["''`]/[^/\\"''`]'
      # a literal same-origin path resolved against the request's own URL stays on this origin
      - patterns:
          - pattern: new URL($P, $B)
          - metavariable-regex:
              metavariable: $P
              regex: '^["''`]/[^/\\"''`]'
          - metavariable-regex:
              metavariable: $B
              regex: '^(req|request)\.(url|originalUrl)$'
      - pattern: encodeURIComponent(...)
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern: $R.redirect($X, ...)
          - metavariable-regex:
              metavariable: $R
              regex: '^(res|response|reply|ctx|resp|h|c|context)(\.(status|type|set|header|code|vary|cookie)\([^()]*\))*$'
          - focus-metavariable: $X
      - patterns:
          - pattern: $R.redirect($S, $X)
          - metavariable-regex:
              metavariable: $R
              regex: '^(res|response|reply|ctx|resp|h|c|context)(\.(status|type|set|header|code|vary|cookie)\([^()]*\))*$'
          - focus-metavariable: $X
      - patterns:
          - pattern: $R.location($X)
          - metavariable-regex:
              metavariable: $R
              regex: '^(res|response|reply|ctx|resp|h|c|context)(\.(status|type|set|header|code|vary|cookie)\([^()]*\))*$'
          - focus-metavariable: $X
      - patterns:
          - pattern: $R.$M($H, $X)
          # header names are case-insensitive, so match "location" in any case
          - metavariable-regex:
              metavariable: $H
              regex: '(?i)^["''`]location["''`]$'
          - metavariable-regex:
              metavariable: $R
              regex: '^(res|response|reply|ctx|resp|h|c|context)(\.(status|type|set|header|code|vary|cookie)\([^()]*\))*$'
          - metavariable-regex:
              metavariable: $M
              regex: '^(setHeader|header|set|append)$'
          - focus-metavariable: $X
      - patterns:
          - pattern: |
              $R.writeHead($S, ..., {..., $K: $X, ...})
          - metavariable-regex:
              metavariable: $K
              regex: '(?i)^["''`]?location["''`]?$'
          - metavariable-regex:
              metavariable: $R
              regex: '^(res|response|reply|ctx|resp|h|c|context)(\.(status|type|set|header|code|vary|cookie)\([^()]*\))*$'
          - focus-metavariable: $X
      - patterns:
          - pattern: NextResponse.redirect($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: Response.redirect($X, ...)
          - focus-metavariable: $X
