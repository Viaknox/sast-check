rules:
  - id: sast.js.jquery-xss
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted browser data (URL parts, referrer, window.name, postMessage payload) reaches a
      jQuery call that parses HTML or sets a URL attribute ($(...), .html(), .append(), .after()
      and similar, or .attr('href'/'src')). That lets an attacker inject markup or a
      javascript: link. Use .text() for text, or sanitize with DOMPurify first.
    metadata:
      sast_severity: high
      confidence: medium
      cwe: "CWE-79"
      category: security
      fix: "Use .text() / .attr() with validated values, or pass HTML through DOMPurify.sanitize() before jQuery inserts it."
      references:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://api.jquery.com/text/
    mode: taint
    pattern-sources:
      - label: INPUT
        pattern-either:
          - pattern: location.hash
          - pattern: location.search
          - pattern: location.href
          - pattern: location.pathname
          - pattern: window.location.hash
          - pattern: window.location.search
          - pattern: window.location.href
          - pattern: window.location.pathname
          - pattern: document.location.hash
          - pattern: document.location.search
          - pattern: document.location.href
          - pattern: document.URL
          - pattern: document.documentURI
          - pattern: document.referrer
          - pattern: window.name
          - pattern: new URLSearchParams(...).get(...)
          - pattern: new URLSearchParams(...).getAll(...)
      - label: INPUT
        patterns:
          - pattern-either:
              - pattern-inside: |
                  $W.addEventListener("message", function($E) { ... })
              - pattern-inside: |
                  $W.addEventListener("message", ($E) => { ... })
              - pattern-inside: |
                  $W.onmessage = function($E) { ... }
              - pattern-inside: |
                  $W.onmessage = ($E) => { ... }
          - pattern: $E.data
      # HTML_SAFE: escaped/sanitized for HTML content. It does NOT make a URL safe: "javascript:alert(1)"
      # survives DOMPurify, sanitizeHtml and escapeHtml, so href/src sinks need URL_SAFE instead.
      - label: HTML_SAFE
        requires: INPUT
        pattern-either:
          - pattern: DOMPurify.sanitize(...)
          - pattern: sanitizeHtml(...)
          - pattern: escapeHtml(...)
          - pattern: $.text(...)
      - label: URL_SAFE
        requires: INPUT
        pattern-either:
          - pattern: isSafeUrl(...)
          - pattern: sanitizeUrl(...)
    pattern-sanitizers:
      # component encoding escapes < > " and ":", so it is safe in HTML content and in a URL
      - pattern: encodeURIComponent(...)
    pattern-sinks:
      - requires: INPUT and not HTML_SAFE
        patterns:
          - pattern-either:
              - pattern: $(...)
              - pattern: jQuery(...)
          - pattern-not: $("...")
          - pattern-not: jQuery("...")
          - pattern-not: $(document)
          - pattern-not: $(window)
          - pattern-not: $(this)
          - pattern-not: $(function() { ... })
          - pattern-not: $(() => { ... })
      - requires: INPUT and not HTML_SAFE
        patterns:
          - pattern-either:
              - pattern: $O.html($X)
              - pattern: $O.append($X)
              - pattern: $O.prepend($X)
              - pattern: $O.after($X)
              - pattern: $O.before($X)
              - pattern: $O.replaceWith($X)
              - pattern: $O.wrap($X)
          - focus-metavariable: $X
      - requires: INPUT and not URL_SAFE
        patterns:
          - pattern-either:
              - pattern: $O.attr("href", $X)
              - pattern: $O.attr("src", $X)
          - focus-metavariable: $X
