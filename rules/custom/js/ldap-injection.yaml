rules:
  - id: sast.js.ldap-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request-controlled data is used to build an LDAP search filter without escaping. An attacker can add filter clauses and read or bypass directory lookups. Escape the value with an LDAP filter escaper first.
    metadata:
      sast_severity: critical
      confidence: high
      cwe: "CWE-90"
      category: security
      fix: 'Escape the value with ldap-escape (ldapEscape.filter`(uid=${name})`) before placing it in a filter.'
      references:
        - https://cwe.mitre.org/data/definitions/90.html
        - https://owasp.org/Top10/A03_2021-Injection/
    mode: taint
    # labels: INPUT is request data; FILTER_SAFE / DN_SAFE mark INPUT passed through an escaper that is right for
    # that position only (a DN escaper does not stop filter injection, and the reverse)
    pattern-sources:
      - label: INPUT
        pattern-either:
          - pattern: req.query
          - pattern: req.body
          - pattern: req.params
          - pattern: req.headers
          - pattern: req.cookies
          - pattern: req.url
          - pattern: req.originalUrl
          - pattern: req.path
          - pattern: req.get(...)
          - pattern: req.header(...)
          - pattern: req.param(...)
          - pattern: req.signedCookies
          - pattern: req.files
          - pattern: request.query
          - pattern: request.body
          - pattern: request.params
          - pattern: request.headers
          - pattern: request.cookies
          - pattern: ctx.query
          - pattern: ctx.request.query
          - pattern: ctx.headers
          - pattern: ctx.cookies.get(...)
          - pattern: ctx.request.body
          - pattern: ctx.params
          - pattern: $U.searchParams.get(...)
          - pattern: location.search
          - pattern: location.hash
      # the handler's own request parameter, whatever it is named: (r, res) => eval(r.query.x)
      - label: INPUT
        patterns:
          - pattern-either:
              - pattern-inside: $APP.$M($P, ..., ($REQ, $RES, ...) => { ... })
              - pattern-inside: $APP.$M($P, ..., async ($REQ, $RES, ...) => { ... })
              - pattern-inside: $APP.$M($P, ..., function ($REQ, $RES, ...) { ... })
              - pattern-inside: $APP.$M($P, ..., async function ($REQ, $RES, ...) { ... })
          - metavariable-regex:
              metavariable: $M
              regex: '^(get|post|put|patch|delete|all|use|head|options)$'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
      - label: FILTER_SAFE
        requires: INPUT
        pattern-either:
          - pattern: ldapEscape.filter(...)
          - pattern: ldapEscape.filter`...`
          - pattern: escapeFilter(...)
          - pattern: escapeLdapFilter(...)
      - label: DN_SAFE
        requires: INPUT
        pattern-either:
          - pattern: ldapEscape.dn(...)
          - pattern: ldapEscape.dn`...`
          - pattern: escapeDn(...)
    pattern-sinks:
      - requires: INPUT and not FILTER_SAFE
        patterns:
          - pattern: |
              $C.search($B, {..., filter: $X, ...}, ...)
          - focus-metavariable: $X
      - requires: INPUT and not FILTER_SAFE
        patterns:
          - pattern: $C.search($B, $OPTS, ...)
          - pattern-not: $C.search($B, {...}, ...)
          - focus-metavariable: $OPTS
      - requires: INPUT and not FILTER_SAFE
        patterns:
          - pattern: $AD.$M($X, ...)
          - metavariable-regex:
              metavariable: $AD
              regex: '(?i)^(ad|activeDirectory|activeDir|directory|adClient)$'
          - metavariable-regex:
              metavariable: $M
              regex: '^(find|findUser|findUsers|findGroup|findGroups|getGroupMembershipForUser|isUserMemberOf)$'
          - focus-metavariable: $X
      # DN positions: the search base and the entry DN of bind/modify/del/compare/add (receiver limited to LDAP-looking clients)
      - requires: INPUT and not DN_SAFE
        patterns:
          - pattern: $C.search($B, $OPTS, ...)
          - metavariable-regex:
              metavariable: $C
              regex: '(?i)^(.*ldap.*|client|ad|activeDirectory|directory|conn|connection)$'
          - focus-metavariable: $B
      - requires: INPUT and not DN_SAFE
        patterns:
          - pattern: $C.$M($DN, ...)
          - metavariable-regex:
              metavariable: $C
              regex: '(?i)^(.*ldap.*|client|ad|activeDirectory|directory|conn|connection)$'
          - metavariable-regex:
              metavariable: $M
              regex: '^(bind|modify|del|compare|add)$'
          - focus-metavariable: $DN
