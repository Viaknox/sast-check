rules:
  - id: sast.js.ldap-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request-controlled data is used to build an LDAP search filter without escaping. An attacker can add filter clauses and read or bypass directory lookups. Escape the value with an LDAP filter escaper first.
    metadata:
      sast_severity: critical
      confidence: high
      cwe: "CWE-90"
      category: security
      fix: 'Escape the value with ldap-escape (ldapEscape.filter`(uid=${name})`) before placing it in a filter.'
      references:
        - https://cwe.mitre.org/data/definitions/90.html
        - https://owasp.org/Top10/A03_2021-Injection/
    mode: taint
    # one rule per position (filter vs DN): an escaper is right for its own position only. Real sanitizers, not labels,
    # so a raw input next to an escaped one is still reported.
    pattern-sources:
      - pattern-either:
          - pattern: req.query
          - pattern: req.body
          - pattern: req.params
          - pattern: req.headers
          - pattern: req.cookies
          - pattern: req.url
          - pattern: req.originalUrl
          - pattern: req.path
          - pattern: req.get(...)
          - pattern: req.header(...)
          - pattern: req.param(...)
          - pattern: req.signedCookies
          - pattern: req.files
          - pattern: request.query
          - pattern: request.body
          - pattern: request.params
          - pattern: request.headers
          - pattern: request.cookies
          - pattern: ctx.query
          - pattern: ctx.request.query
          - pattern: ctx.headers
          - pattern: ctx.cookies.get(...)
          - pattern: ctx.request.body
          - pattern: ctx.params
          - pattern: $U.searchParams.get(...)
          - pattern: location.search
          - pattern: location.hash
      # the handler's own request parameter, whatever it is named: (r, res) => eval(r.query.x)
      - patterns:
          - pattern-either:
              - pattern-inside: $APP.$M($P, ..., ($REQ, $RES, ...) => { ... })
              - pattern-inside: $APP.$M($P, ..., async ($REQ, $RES, ...) => { ... })
              - pattern-inside: $APP.$M($P, ..., function ($REQ, $RES, ...) { ... })
              - pattern-inside: $APP.$M($P, ..., async function ($REQ, $RES, ...) { ... })
          - metavariable-regex:
              metavariable: $M
              regex: '^(get|post|put|patch|delete|all|use|head|options)$'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
    # sanitizers count only when the function really comes from the ldap-escape package (require or import),
    # so a local helper or object that happens to be called ldapEscape or escapeFilter does not clean the value
    pattern-sanitizers:
      # a pattern with (...) also matches the tagged-template call form, ldapEscape.filter`(uid=${x})`
      - patterns:
          - pattern: $E.filter(...)
          - pattern-either:
              - pattern-inside: |
                  $E = require("ldap-escape");
                  ...
              - pattern-inside: |
                  import $E from "ldap-escape";
                  ...
              - pattern-inside: |
                  import * as $E from "ldap-escape";
                  ...
          - pattern-not-inside: |
              $E = {...};
              ...
      - patterns:
          - pattern: filter(...)
          - pattern-inside: |
              import { filter } from "ldap-escape";
              ...
      - patterns:
          - pattern: $K(...)
          # the engine reads const { filter: $K } = require("ldap-escape") as the same import
          - pattern-inside: |
              import { filter as $K } from "ldap-escape";
              ...
    pattern-sinks:
      # the receiver must be a client built by ldapjs or ldapts in this file, not any object with a search() method
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: |
                      $C.search($B, {..., filter: $X, ...}, ...)
                  - focus-metavariable: $X
              - patterns:
                  - pattern: $C.search($B, $OPTS, ...)
                  - pattern-not: $C.search($B, {...}, ...)
                  - focus-metavariable: $OPTS
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $L = require("ldapjs");
                          ...
                      - pattern-inside: |
                          import $L from "ldapjs";
                          ...
                      - pattern-inside: |
                          import * as $L from "ldapjs";
                          ...
                  - pattern-inside: |
                      $C = $L.createClient(...);
                      ...
              - pattern-inside: |
                  $C = require("ldapjs").createClient(...);
                  ...
              - patterns:
                  - pattern-inside: |
                      import { createClient } from "ldapjs";
                      ...
                  - pattern-inside: |
                      $C = createClient(...);
                      ...
              - patterns:
                  - pattern-inside: |
                      import { createClient as $K } from "ldapjs";
                      ...
                  - pattern-inside: |
                      $C = $K(...);
                      ...
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $L = require("ldapts");
                          ...
                      - pattern-inside: |
                          import * as $L from "ldapts";
                          ...
                  - pattern-inside: |
                      $C = new $L.Client(...);
                      ...
              - patterns:
                  - pattern-inside: |
                      import { Client } from "ldapts";
                      ...
                  - pattern-inside: |
                      $C = new Client(...);
                      ...
              - patterns:
                  - pattern-inside: |
                      import { Client as $K } from "ldapts";
                      ...
                  - pattern-inside: |
                      $C = new $K(...);
                      ...
      # fallback for a client built in another module (const ldapClient = require("./ldap-client"), this.ldap, a parameter):
      # the receiver's own name must say ldap. Names like client, conn or directory prove nothing and are not trusted.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          $C.search($B, {..., filter: $X, ...}, ...)
                      # a property receiver (this.ldap) is only matched when its last name is spelled out
                      - pattern: |
                          $O.$C.search($B, {..., filter: $X, ...}, ...)
                  - focus-metavariable: $X
              - patterns:
                  - pattern-either:
                      - pattern: $C.search($B, $OPTS, ...)
                      - pattern: $O.$C.search($B, $OPTS, ...)
                  - pattern-not: $C.search($B, {...}, ...)
                  - pattern-not: $O.$C.search($B, {...}, ...)
                  - focus-metavariable: $OPTS
          - metavariable-regex:
              metavariable: $C
              regex: '(?i)ldap'
      - patterns:
          - pattern: $AD.$M($X, ...)
          - metavariable-regex:
              metavariable: $AD
              regex: '(?i)^(ad|activeDirectory|activeDir|directory|adClient)$'
          - metavariable-regex:
              metavariable: $M
              regex: '^(find|findUser|findUsers|findGroup|findGroups|getGroupMembershipForUser|isUserMemberOf)$'
          - focus-metavariable: $X
