rules:
  - id: sast.js.tls-reject-unauthorized-off
    languages: [javascript, typescript]
    severity: INFO
    message: >-
      TLS certificate checking is switched off (NODE_TLS_REJECT_UNAUTHORIZED=0 or
      rejectUnauthorized: false). Anyone on the network path can impersonate the server and read
      or change traffic. Trust the right CA instead (the ca option or NODE_EXTRA_CA_CERTS) and
      keep verification on.
    metadata:
      sast_severity: low
      confidence: high
      cwe: "CWE-295"
      category: security
      fix: "Remove the override; for private CAs pass ca: fs.readFileSync('ca.pem') or set NODE_EXTRA_CA_CERTS."
      references:
        - https://cwe.mitre.org/data/definitions/295.html
        - https://nodejs.org/api/tls.html#tlsconnectoptions-callback
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
      - pattern: $X.rejectUnauthorized = false
      - patterns:
          - pattern: |
              { ..., rejectUnauthorized: false, ... }
          - pattern-not-inside: new Sequelize(...)
          - pattern-not-inside: new Pool(...)
          - pattern-not-inside: new Client(...)
          - pattern-not-inside: new $NS.Pool(...)
          - pattern-not-inside: new $NS.Client(...)
          - pattern-not-inside: $NS.createConnection(...)
          - pattern-not-inside: $NS.createPool(...)
          - pattern-not-inside: createConnection(...)
          - pattern-not-inside: createPool(...)
