                    ...
                  }
              - pattern-not-inside: |
                  async function $F(...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  async function (...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
          - patterns:
              - pattern: decode(...)
              - pattern-inside: |
                  import { ..., decode, ... } from "jsonwebtoken";
