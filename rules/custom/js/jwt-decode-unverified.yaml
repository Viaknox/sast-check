                    ...
                    <... verify(...) ...>
                    ...
                  }
          - patterns:
              - pattern: decode(...)
              - pattern-inside: |
                  const { ..., decode, ... } = require("jsonwebtoken");
                  ...
              - pattern-not-inside: |
                  function $F(...) {
                    ...
