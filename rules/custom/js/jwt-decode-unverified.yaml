rules:
  - id: sast.js.jwt-decode-unverified
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      jsonwebtoken decode() is used in a function that never calls verify(), or verify() is told to accept the "none" algorithm. decode() does not check the signature, so a forged token passes as genuine. Verify the signature with a pinned algorithm before trusting any claim.
    metadata:
      sast_severity: high
      confidence: medium
      cwe: "CWE-347"
      category: security
      fix: 'Use jwt.verify(token, key, { algorithms: ["RS256"] }) for any decision; never allow the none algorithm.'
      references:
        - https://cwe.mitre.org/data/definitions/347.html
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $J.decode(...)
              - pattern-inside: |
                  const $J = require("jsonwebtoken");
                  ...
              - pattern-not-inside: |
                  function $F(...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  function (...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  (...) => {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  async (...) => {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  async function $F(...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  async function (...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
          - patterns:
              - pattern: $J.decode(...)
              - pattern-inside: |
                  import $J from "jsonwebtoken";
                  ...
              - pattern-not-inside: |
                  function $F(...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  function (...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  (...) => {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  async (...) => {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  async function $F(...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  async function (...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
          - patterns:
              - pattern: $J.decode(...)
              - pattern-inside: |
                  import * as $J from "jsonwebtoken";
                  ...
              - pattern-not-inside: |
                  function $F(...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  function (...) {
                    ...
                    <... $V.verify(...) ...>
                    ...
                  }
              - pattern-not-inside: |
                  (...) => {
                    ...
