rules:
  - id: sast.js.command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request-controlled data reaches a child process call, either as the shell command line or as the command itself. An attacker can run arbitrary commands on the server. Call execFile or spawn with a fixed program and a separate argument array, without shell: true.
    metadata:
      sast_severity: high
      confidence: high
      cwe: "CWE-78"
      category: security
      fix: 'Avoid the shell: use execFile/spawn with a fixed command and an argument array, and validate arguments against an allow-list.'
      references:
        - https://cwe.mitre.org/data/definitions/78.html
        - https://owasp.org/Top10/A03_2021-Injection/
    mode: taint
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern: req.cookies
      - pattern: req.url
      - pattern: req.originalUrl
      - pattern: req.path
      - pattern: req.get(...)
      - pattern: req.header(...)
      - pattern: req.param(...)
      - pattern: req.signedCookies
      - pattern: req.files
      - pattern: request.query
      - pattern: request.body
      - pattern: request.params
      - pattern: request.headers
      - pattern: request.cookies
      # the handler's own request parameter, whatever it is named: (r, res) => eval(r.query.x)
      - patterns:
          - pattern-either:
              - pattern-inside: $APP.$M($P, ..., ($REQ, $RES, ...) => { ... })
              - pattern-inside: $APP.$M($P, ..., async ($REQ, $RES, ...) => { ... })
              - pattern-inside: $APP.$M($P, ..., function ($REQ, $RES, ...) { ... })
              - pattern-inside: $APP.$M($P, ..., async function ($REQ, $RES, ...) { ... })
          - metavariable-regex:
              metavariable: $M
              regex: '^(get|post|put|patch|delete|all|use|head|options)$'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
      - pattern: ctx.query
      - pattern: ctx.request.query
      - pattern: ctx.headers
      - pattern: ctx.cookies.get(...)
      - pattern: ctx.request.body
      - pattern: ctx.params
      - pattern: $U.searchParams.get(...)
      - pattern: location.search
      - pattern: location.hash
    pattern-sanitizers:
      - pattern: shellescape(...)
      - pattern: shellEscape(...)
      - pattern: escapeShell(...)
      # only shell-quote style libraries; any other receiver's .quote() (formatter.quote) proves nothing
      - patterns:
          - pattern: $Q.quote(...)
          - metavariable-regex:
              metavariable: $Q
              regex: '(?i)^(shell[-_]?quote|shq|sq|shellEscape)$'
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    # The function must come from the child_process module: a variable assigned from require("child_process" or
    # "node:child_process"), an import of it, or a named import. db.exec(), shell.exec() and /re/.exec() do not count.
    pattern-sinks:
      # called as a method of the module object: cp.exec(...), cp.spawn(...)
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $CP.$F($X, ...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: '^(exec|execSync|spawn|spawnSync|execFile|execFileSync)$'
              - patterns:
                  - pattern: |
                      $CP.$F($C, $X, {..., shell: true, ...})
                  - metavariable-regex:
                      metavariable: $F
                      regex: '^(spawn|spawnSync|execFile|execFileSync)$'
              - patterns:
                  - pattern: $CP.$F($SH, [..., "-c", $X, ...], ...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: '^(spawn|spawnSync|execFile|execFileSync)$'
                  - metavariable-regex:
                      metavariable: $SH
                      regex: '^["''](/bin/|/usr/bin/)?(ba|z|da)?sh["'']$'
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $CP = require($MOD);
                      ...
                  - metavariable-regex:
                      metavariable: $MOD
                      regex: '^["'']((node:)?child_process)["'']$'
              - pattern-inside: |
                  import $CP from "child_process";
                  ...
              - pattern-inside: |
                  import $CP from "node:child_process";
                  ...
              - pattern-inside: |
                  import * as $CP from "child_process";
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process";
                  ...
          - focus-metavariable: $X
      # called by name after a named import: const { exec } = require("child_process") reads as the same import
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $F($X, ...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: '^(exec|execSync|spawn|spawnSync|execFile|execFileSync)$'
              - patterns:
                  - pattern: |
                      $F($C, $X, {..., shell: true, ...})
                  - metavariable-regex:
                      metavariable: $F
                      regex: '^(spawn|spawnSync|execFile|execFileSync)$'
              - patterns:
                  - pattern: $F($SH, [..., "-c", $X, ...], ...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: '^(spawn|spawnSync|execFile|execFileSync)$'
                  - metavariable-regex:
                      metavariable: $SH
                      regex: '^["''](/bin/|/usr/bin/)?(ba|z|da)?sh["'']$'
          - pattern-either:
              - pattern-inside: |
                  import { $F } from "child_process";
                  ...
              - pattern-inside: |
                  import { $F } from "node:child_process";
                  ...
          - focus-metavariable: $X
