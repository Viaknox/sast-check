rules:
  - id: sast.js.puppeteer-ssrf
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request-controlled data is handed to a headless browser page (goto, setContent or evaluate). The browser can then fetch internal URLs, read local files or run attacker script with server-side network access. Restrict navigation to an allow-list and keep untrusted data out of page content and scripts.
    metadata:
      sast_severity: critical
      confidence: medium
      cwe: "CWE-918"
      category: security
      fix: 'Only navigate to URLs from an allow-list of hosts, and never feed request data into setContent or evaluate.'
      references:
        - https://cwe.mitre.org/data/definitions/918.html
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    mode: taint
    # labels: INPUT is request data; FIXED_ORIGIN marks INPUT appended to a literal https://host/ prefix.
    # A fixed origin makes goto() safe, but not setContent/evaluate (the prefix is inert text there).
    pattern-sources:
      - label: INPUT
        pattern-either:
          - pattern: req.query
          - pattern: req.body
          - pattern: req.params
          - pattern: req.headers
          - pattern: req.cookies
          - pattern: req.url
          - pattern: req.originalUrl
          - pattern: req.path
          - pattern: req.get(...)
          - pattern: req.header(...)
          - pattern: req.param(...)
          - pattern: req.signedCookies
          - pattern: req.files
          - pattern: request.query
          - pattern: request.body
          - pattern: request.params
          - pattern: request.headers
          - pattern: request.cookies
          - pattern: ctx.query
          - pattern: ctx.request.query
          - pattern: ctx.headers
          - pattern: ctx.cookies.get(...)
          - pattern: ctx.request.body
          - pattern: ctx.params
          - pattern: $U.searchParams.get(...)
          - pattern: location.search
          - pattern: location.hash
      # the handler's own request parameter, whatever it is named: (r, res) => eval(r.query.x)
      - label: INPUT
        patterns:
          - pattern-either:
              - pattern-inside: $APP.$M($P, ..., ($REQ, $RES, ...) => { ... })
              - pattern-inside: $APP.$M($P, ..., async ($REQ, $RES, ...) => { ... })
              - pattern-inside: $APP.$M($P, ..., function ($REQ, $RES, ...) { ... })
              - pattern-inside: $APP.$M($P, ..., async function ($REQ, $RES, ...) { ... })
          - metavariable-regex:
              metavariable: $M
              regex: '^(get|post|put|patch|delete|all|use|head|options)$'
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
      - label: FIXED_ORIGIN
        requires: INPUT
        patterns:
          - pattern: $P + $X
          - metavariable-regex:
              metavariable: $P
              regex: '^["''`]https?://[^/"''`]+/'
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    # The receiver must be a page, shown by one of:
    #   - a variable assigned from `await <browser or context>.newPage()`
    #   - that expression written inline
    #   - a function parameter, when the file requires/imports puppeteer or puppeteer-core above it
    # A variable's name decides nothing, and without a puppeteer import a parameter proves nothing.
    pattern-sinks:
      # navigation: a fixed https://host/ origin or component encoding keeps the host fixed
      - requires: INPUT and not FIXED_ORIGIN
        patterns:
          - pattern-either:
              - patterns:
                  - pattern: $PAGE.goto($X, ...)
                  - pattern-either:
                      - pattern-inside: |
                          $PAGE = await $B.newPage(...);
                          ...
                      - pattern-inside: |
                          [$PAGE, ...] = await $B.pages();
                          ...
                      - pattern-inside: |
                          $PAGE = (await $B.pages())[0];
                          ...
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  function $F(..., $PAGE, ...) { ... }
                              - pattern-inside: |
                                  ($PAGE, ...) => { ... }
                          - pattern-either:
                              - pattern-inside: |
                                  $P = require($M);
                                  ...
                              - pattern-inside: |
                                  import * as $P from $M;
                                  ...
                              - pattern-inside: |
                                  import { ... } from $M;
                                  ...
                          - metavariable-regex:
                              metavariable: $M
                              regex: '^["''`]?puppeteer(-core)?["''`]?$'
              - pattern: (await $B.newPage()).goto($X, ...)
          - pattern-not: $PAGE.goto(encodeURIComponent(...), ...)
          - focus-metavariable: $X
      # page content and code: no prefix or URL encoding makes request data safe here
      - requires: INPUT
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern: $PAGE.$M2($X, ...)
                          - metavariable-regex:
                              metavariable: $M2
                              regex: '^(setContent|evaluate|evaluateOnNewDocument|waitForFunction)$'
                      - patterns:
                          - pattern: |
                              $PAGE.addScriptTag({..., $K: $X, ...})
                          - metavariable-regex:
                              metavariable: $K
                              regex: '^(url|content)$'
                  - pattern-either:
                      - pattern-inside: |
                          $PAGE = await $B.newPage(...);
                          ...
                      - pattern-inside: |
                          [$PAGE, ...] = await $B.pages();
                          ...
                      - pattern-inside: |
                          $PAGE = (await $B.pages())[0];
                          ...
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  function $F(..., $PAGE, ...) { ... }
                              - pattern-inside: |
                                  ($PAGE, ...) => { ... }
                          - pattern-either:
                              - pattern-inside: |
                                  $P = require($M);
                                  ...
                              - pattern-inside: |
                                  import * as $P from $M;
                                  ...
                              - pattern-inside: |
                                  import { ... } from $M;
                                  ...
                          - metavariable-regex:
                              metavariable: $M
                              regex: '^["''`]?puppeteer(-core)?["''`]?$'
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern: (await $B.newPage()).$M2($X, ...)
                          - metavariable-regex:
                              metavariable: $M2
                              regex: '^(setContent|evaluate|evaluateOnNewDocument|waitForFunction)$'
                      - patterns:
                          - pattern: |
                              (await $B.newPage()).addScriptTag({..., $K: $X, ...})
                          - metavariable-regex:
                              metavariable: $K
                              regex: '^(url|content)$'
          - focus-metavariable: $X
