rules:
  - id: sast.gha.remote-fetch-no-checksum
    languages: [yaml]
    severity: WARNING
    message: >-
      This run step either pipes a download straight into a shell, or downloads a file with
      curl/wget and never checks a hash or signature in the same step. If the host or a
      mirror is compromised, the build runs attacker code with your job's secrets. Download
      to a file, verify a pinned sha256 (or cosign/gpg signature), and only then run it.
    metadata:
      sast_severity: medium
      confidence: medium
      cwe: "CWE-494"
      category: security
      fix: "curl -fsSLo tool.tgz URL && echo '<sha256>  tool.tgz' | sha256sum -c - before extracting or executing."
      references:
        - https://cwe.mitre.org/data/definitions/494.html
        - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
    pattern-either:
      - patterns:
          - pattern: |
              run: $SCRIPT
          - metavariable-regex:
              metavariable: $SCRIPT
              # pipe into an interpreter, or process/command substitution fed to sh -c, eval, source or `.`; `python -m json.tool` only pretty-prints
              regex: '(?s).*(?:\b(?:curl|wget)\b[^\n|]*\|[ \t]*(?:sudo[ \t]+(?:-[A-Za-z]+[ \t]+)*)?(?:(?:ba|z|da|k)?sh|python[0-9.]*|node|perl|ruby)\b(?![ \t]+-m[ \t]+json\.tool)|(?:\b(?:(?:ba|z|da|k)?sh|source|eval)\b[ \t]+(?:-[A-Za-z]+[ \t]+)*[\"'']?(?:<\((?:curl|wget)\b|\$\((?:curl|wget)\b[^)]*\))|(?:^|[\s;&|])\.[ \t]+[\"'']?(?:<\(|\$\()(?:curl|wget)\b)).*'
      - patterns:
          - pattern: |
              run: $SCRIPT
          - metavariable-regex:
              metavariable: $SCRIPT
              regex: '(?s).*(?:\bcurl\b[^\n|]*[ \t](?:-[A-Za-z]*[oO]\b|--output\b|--remote-name\b)(?![ \t]+/dev/null)|\bwget\b[ \t]+(?![^\n]*(?:--spider|-[A-Za-z]*O[ \t]*-)))[^\n|]*(?:\n|$).*'
          - metavariable-regex:
              metavariable: $SCRIPT
              # A "verification" is a real check: sha*sum / shasum with -c or --check, a signature tool, or a
              # computed hash compared on the same line ([ ], test, grep, diff, cmp). A hash that is only
              # printed does not count. Fires when (1) nothing is verified, (2) a file saved with -o/-O is
              # never named on a line that verifies it (a checksum of one artifact must not cover another
              # download), or (3) a download is extracted or run before any verification follows it.
              regex: '(?s)^(?:(?!.*(?:(?:sha(?:1|224|256|384|512)sum|b2sum|shasum)\b[^\n]*[ \t](?:-[A-Za-z]*c[A-Za-z]*|--check)\b|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|minisign[ \t]+-V|(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b[^\n]*(?:\|[ \t]*(?:grep|diff|cmp)\b|\b(?:diff|cmp|test)\b|\[\[?[ \t]|==)|(?:\[\[?[ \t]|\btest\b|\bdiff\b|\bcmp\b|\bgrep\b|==)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b)).*|.*?(?:\bcurl\b[^\n|]*?[ \t](?:-[A-Za-z]*o|--output)[ \t]*|\bwget\b[^\n|]*?[ \t]-[A-Za-z]*O[ \t]*)(?P<F>[^\s;&|''\"\\]+)(?!(?=[^\n]*?(?:(?:sha(?:1|224|256|384|512)sum|b2sum|shasum)\b[^\n]*[ \t](?:-[A-Za-z]*c[A-Za-z]*|--check)\b|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|minisign[ \t]+-V|(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b[^\n]*(?:\|[ \t]*(?:grep|diff|cmp)\b|\b(?:diff|cmp|test)\b|\[\[?[ \t]|==)|(?:\[\[?[ \t]|\btest\b|\bdiff\b|\bcmp\b|\bgrep\b|==)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b))|.*\n(?=[^\n]*(?P=F))(?=[^\n]*?(?:(?:sha(?:1|224|256|384|512)sum|b2sum|shasum)\b[^\n]*[ \t](?:-[A-Za-z]*c[A-Za-z]*|--check)\b|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|minisign[ \t]+-V|(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b[^\n]*(?:\|[ \t]*(?:grep|diff|cmp)\b|\b(?:diff|cmp|test)\b|\[\[?[ \t]|==)|(?:\[\[?[ \t]|\btest\b|\bdiff\b|\bcmp\b|\bgrep\b|==)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b))).*|.*?\b(?:curl|wget)\b(?:(?!(?:(?:sha(?:1|224|256|384|512)sum|b2sum|shasum)\b[^\n]*[ \t](?:-[A-Za-z]*c[A-Za-z]*|--check)\b|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|minisign[ \t]+-V|(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b[^\n]*(?:\|[ \t]*(?:grep|diff|cmp)\b|\b(?:diff|cmp|test)\b|\[\[?[ \t]|==)|(?:\[\[?[ \t]|\btest\b|\bdiff\b|\bcmp\b|\bgrep\b|==)[^\n]*(?:sha(?:1|224|256|384|512)sum|shasum|openssl[ \t]+dgst)\b)).)*?(?:\n|[;&|(])[ \t]*(?:sudo[ \t]+(?:-[A-Za-z]+[ \t]+)*)?(?:tar|unzip|gunzip|bunzip2|unxz|7za?|dpkg|rpm|\./\S+|(?:ba|z|da|k)?sh|source|python[0-9.]*|node|perl|ruby)(?=[ \t\n]|$).*)$'
          - metavariable-regex:
              metavariable: $SCRIPT
              regex: '(?s)^(?!.*\|[ \t]*(?:sudo[ \t]+)?(?:(?:ba|z|da|k)?sh|python[0-9.]*|node|perl|ruby)\b(?![ \t]+-m[ \t]+json\.tool)).*'
    paths:
      # only files GitHub runs: workflows and action metadata (a sample "curl | sh" in docs/ is not executed)
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - "action.yml"
        - "action.yaml"
