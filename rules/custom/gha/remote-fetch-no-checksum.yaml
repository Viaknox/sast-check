rules:
  - id: sast.gha.remote-fetch-no-checksum
    languages: [yaml]
    severity: WARNING
    message: >-
      This run step either pipes a download straight into a shell, or downloads a file with
      curl/wget and never checks a hash or signature in the same step. If the host or a
      mirror is compromised, the build runs attacker code with your job's secrets. Download
      to a file, verify a pinned sha256 (or cosign/gpg signature), and only then run it.
    metadata:
      sast_severity: medium
      confidence: medium
      cwe: "CWE-494"
      category: security
      fix: "curl -fsSLo tool.tgz URL && echo '<sha256>  tool.tgz' | sha256sum -c - before extracting or executing."
      references:
        - https://cwe.mitre.org/data/definitions/494.html
        - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
    pattern-either:
      - patterns:
          - pattern: |
              run: $SCRIPT
          - metavariable-regex:
              metavariable: $SCRIPT
              # pipe into an interpreter, or process/command substitution fed to sh -c, eval, source or `.`; `python -m json.tool` only pretty-prints
              regex: '(?s).*(?:\b(?:curl|wget)\b[^\n|]*\|[ \t]*(?:sudo[ \t]+(?:-[A-Za-z]+[ \t]+)*)?(?:(?:ba|z|da|k)?sh|python[0-9.]*|node|perl|ruby)\b(?![ \t]+-m[ \t]+json\.tool)|(?:\b(?:(?:ba|z|da|k)?sh|source|eval)\b[ \t]+(?:-[A-Za-z]+[ \t]+)*[\"'']?(?:<\((?:curl|wget)\b|\$\((?:curl|wget)\b[^)]*\))|(?:^|[\s;&|])\.[ \t]+[\"'']?(?:<\(|\$\()(?:curl|wget)\b)).*'
      - patterns:
          - pattern: |
              run: $SCRIPT
          - metavariable-regex:
              metavariable: $SCRIPT
              regex: '(?s).*(?:\bcurl\b[^\n|]*[ \t](?:-[A-Za-z]*[oO]\b|--output\b|--remote-name\b)(?![ \t]+/dev/null)|\bwget\b[ \t]+(?![^\n]*(?:--spider|-[A-Za-z]*O[ \t]*-)))[^\n|]*(?:\n|$).*'
          - metavariable-regex:
              metavariable: $SCRIPT
              # fires when nothing is verified, or when a file saved with -o/-O is never named on a line
              # that verifies it (a checksum of one artifact must not cover another download)
              regex: '(?s)^(?:(?!.*(?:sha256sum|sha512sum|shasum[ \t]+-a[ \t]*(?:256|512)|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|openssl[ \t]+dgst|minisign[ \t]+-V)).*|.*?(?:\bcurl\b[^\n|]*?[ \t](?:-[A-Za-z]*o|--output)[ \t]*|\bwget\b[^\n|]*?[ \t]-[A-Za-z]*O[ \t]*)(?P<F>[^\s;&|''\"\\]+)(?!.*(?:(?P=F)[^\n]*(?:sha256sum|sha512sum|shasum[ \t]+-a[ \t]*(?:256|512)|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|openssl[ \t]+dgst|minisign[ \t]+-V)|(?:sha256sum|sha512sum|shasum[ \t]+-a[ \t]*(?:256|512)|cosign[ \t]+verify|gpg[ \t]+--verify|gpgv\b|openssl[ \t]+dgst|minisign[ \t]+-V)[^\n]*(?P=F))).*)$'
          - metavariable-regex:
              metavariable: $SCRIPT
              regex: '(?s)^(?!.*\|[ \t]*(?:sudo[ \t]+)?(?:(?:ba|z|da|k)?sh|python[0-9.]*|node|perl|ruby)\b(?![ \t]+-m[ \t]+json\.tool)).*'
