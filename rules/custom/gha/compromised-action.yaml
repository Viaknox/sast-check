rules:
  - id: sast.gha.compromised-action
    languages: [yaml]
    severity: ERROR
    message: >-
      This workflow uses an action that was hijacked in a March 2025 supply-chain attack
      (tj-actions/changed-files, CVE-2025-30066, and the reviewdog/action-* family,
      CVE-2025-30154) and it is not pinned to a full commit SHA. Mutable tags were rewritten
      to leak CI secrets. Rotate any secrets that runs using a tag could see, pin to a full
      40-character SHA, and consider a different action.
    metadata:
      sast_severity: critical
      confidence: high
      cwe: "CWE-829"
      category: security
      fix: "Pin to a reviewed full commit SHA (uses: owner/action@<40-hex>), rotate exposed secrets, or replace the action with plain git commands."
      references:
        - https://nvd.nist.gov/vuln/detail/CVE-2025-30066
        - https://nvd.nist.gov/vuln/detail/CVE-2025-30154
        - https://cwe.mitre.org/data/definitions/829.html
    # GitHub resolves owner/repo case-insensitively; YAML allows an anchor and a !!str tag before the value
    pattern-regex: '(?m)^[ \t]*(?:-[ \t]+)?uses:[ \t]*(?:&\w+[ \t]+)?(?:!!str[ \t]+)?["'']?(?i:tj-actions/changed-files|tj-actions/eslint-changed-files|reviewdog/action-[A-Za-z0-9_.-]+)(?:/[A-Za-z0-9_./-]+)?@(?![0-9a-fA-F]{40}["'']?[ \t]*(?:#.*)?$)[^\s"''#]+'
    paths:
      # only files GitHub runs: workflows and action metadata (an example in docs/ is not executed)
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - "action.yml"
        - "action.yaml"
