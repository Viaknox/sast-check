rules:
  - id: sast.gha.ai-prompt-injection
    languages: [yaml]
    severity: ERROR
    message: >-
      Text that an outsider controls (issue or PR title and body, comment, review, branch name,
      commit message) is pasted into the inputs of an AI step. Anyone who can open an issue or
      comment can plant instructions that steer the model, which often has repo write access
      and secrets. Pass the text as untrusted data through an env var, limit the tools the
      agent has, and gate the job on trusted authors.
    metadata:
      sast_severity: high
      confidence: medium
      cwe: "CWE-1427"
      category: security
      fix: "Do not interpolate event text into the prompt. Fetch it inside the agent with read-only tools, restrict permissions, and require a trusted author or label before the job runs."
      references:
        - https://cwe.mitre.org/data/definitions/1427.html
        - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
    patterns:
      - pattern-inside: |
          uses: $ACTION
          ...
          with:
            ...
      - pattern-inside: |
          with:
            ...
      - metavariable-regex:
          metavariable: $ACTION
          regex: (?i).*(?:^|[/-])(?:ai-inference|claude|codex|anthropic|anthropics|gpt|gemini|llm|openai)(?:$|[/@-])
      - pattern-regex: '\$\{\{[^}]*(?:github\.event\.(?:issue\.(?:title|body)|pull_request\.(?:title|body|head\.ref|head\.label|head\.repo\.default_branch)|comment\.body|review\.body|review_comment\.body|discussion\.(?:title|body)|discussion_comment\.body|head_commit\.message|head_commit\.author\.(?:name|email)|commits\[?\*?[0-9]*\]?\.message|commits\.\*\.message|pages\.\*\.page_name)|github\.head_ref)[^}]*\}\}'
