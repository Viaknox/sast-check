name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # the mutation check lists the PR's changed files

jobs:
  test:
    name: rules + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 90   # setup + rule tests ~6 min, speed check up to 20, mutation check up to 60, end-to-end ~3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install tools
        env:
          OPENGREP_VERSION: v1.30.2
        run: |
          set -euo pipefail
          python -m pip install --quiet "pyyaml==6.0.3" "ruff==0.16.8" "zizmor==1.30.1" "semgrep==1.180.0"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0   # same pin as action.yml
          d="$RUNNER_TEMP/opengrep"; mkdir -p "$d"
          base="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          curl -fsSL --retry 3 -o "$d/opengrep" "$base"
          curl -fsSL --retry 3 -o "$d/opengrep.sig" "$base.sig"
          curl -fsSL --retry 3 -o "$d/opengrep.cert" "$base.cert"
          cosign verify-blob --cert "$d/opengrep.cert" --signature "$d/opengrep.sig" \
            --certificate-identity-regexp "^https://github.com/opengrep/opengrep/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$d/opengrep"
          chmod +x "$d/opengrep"
      - name: dist/rules.yaml is up to date; no shipped rule ID dropped
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          # compare with the PR's base branch, or on a push with the commit before the push (main allows no
          # force-push, so it exists); only a branch's first push has nothing to compare with
          ref="$BASE_REF"
          if [ -z "$ref" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then ref="$BEFORE"; fi
          # fetch a file from that ref; only "not there yet" (404) may fall back to empty,
          # any other error fails closed
          base_file() {
            : > "$2"
            [ -n "$ref" ] || return 0
            if ! gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$1?ref=$ref" > "$2" 2> "$RUNNER_TEMP/gh.err"; then
              if grep -q "HTTP 404" "$RUNNER_TEMP/gh.err"; then : > "$2"; else cat "$RUNNER_TEMP/gh.err" >&2; exit 1; fi
            fi
          }
          base_file dist/rule-ids.lock "$RUNNER_TEMP/base-rule-ids.lock"
          base_file rules/RETIRED.txt "$RUNNER_TEMP/base-retired.txt"
          python scripts/build_rules.py --base-lock "$RUNNER_TEMP/base-rule-ids.lock" \
            --base-retired "$RUNNER_TEMP/base-retired.txt" && git diff --exit-code dist/
      - name: Rule tests (semgrep CE)
        run: python tests/rules_test.py --engine "$(command -v semgrep)"
      - name: Rule tests (opengrep - the CI engine)
        run: python tests/rules_test.py --engine "$RUNNER_TEMP/opengrep/opengrep"
      - name: Rule-quality tool tests
        run: OPENGREP="$RUNNER_TEMP/opengrep/opengrep" python tests/tools_test.py
      - name: Learner rule tests (tools/learner_rules.py, offline with canned drafts)
        run: OPENGREP="$RUNNER_TEMP/opengrep/opengrep" python tests/learner_rules_test.py
      - name: Rule speed check (changed rules)
        # a changed rule must not be much slower than the base branch's version on a large file built from its
        # fixture (tools/rule_perf.py; PR #11 found two 30-45x slowdowns by hand)
        timeout-minutes: 20
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # the exact base commit this run was created for, so a base branch that moves meanwhile cannot change it
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # GitHub API calls: a transient error is retried twice; a 404 is reported to the caller; anything else
          # after three tries fails closed
          gh_get() {   # gh_get OUT ARGS...
            out="$1"; shift
            for i in 1 2 3; do
              if gh api "$@" > "$out" 2> "$RUNNER_TEMP/gh.err"; then return 0; fi
              if grep -q "HTTP 404" "$RUNNER_TEMP/gh.err"; then return 4; fi
              sleep $((i * 10))
            done
            cat "$RUNNER_TEMP/gh.err" >&2; exit 1
          }
          gh_get "$RUNNER_TEMP/perf-changed.txt" --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename'
          # the files API lists at most 3,000 files: a shorter list than the PR's own count would skip rules silently
          got=$(grep -c . "$RUNNER_TEMP/perf-changed.txt" || true)
          if [ "$got" -lt "$CHANGED_FILES" ]; then
            echo "the PR changes $CHANGED_FILES files but the files API listed $got: cannot tell which rules changed" >&2; exit 1
          fi
          # a renamed rule is compared with its base version under the old name (tab-separated: names may hold spaces)
          gh_get "$RUNNER_TEMP/perf-renames.txt" --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | select(.previous_filename) | "\(.filename)\t\(.previous_filename)"'
          base="$RUNNER_TEMP/perf-base"
          # only rule paths of letters, digits and . _ - are listed; the check itself reports any other name
          python tools/rule_perf.py --list --changed-files "$RUNNER_TEMP/perf-changed.txt" > "$RUNNER_TEMP/perf-rules.txt"
          # the base version of each rule; only "not there yet" (404, a new rule) may be missing
          while read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "$base/$(dirname "$f")"
            src=$(awk -F '\t' -v f="$f" '$1 == f { print $2 }' "$RUNNER_TEMP/perf-renames.txt")
            case "${src:-$f}" in *[!A-Za-z0-9._/-]*) echo "unexpected old name for $f: $src" >&2; exit 1;; esac
            rc=0; gh_get "$base/$f" -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/${src:-$f}?ref=$BASE_SHA" || rc=$?
            if [ "$rc" = 4 ]; then rm -f "$base/$f"; fi
          done < "$RUNNER_TEMP/perf-rules.txt"
          python tools/rule_perf.py --engine "$RUNNER_TEMP/opengrep/opengrep" --base-dir "$base" \
            --changed-files "$RUNNER_TEMP/perf-changed.txt"
      - name: Rule mutation check (changed rules)
        # PR #11 (many rules): 34 min on one run, over 40 on two re-runs of the same commit; 60 leaves room
        # for runner speed (the job limit above counts this, the speed check and the other steps)
        timeout-minutes: 60
        # every pattern element of a changed rule must be exercised by its fixture, unless the baseline
        # (tests/mutation-baseline.json) lists it with a reason; see docs/rule-quality.md
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          python tools/rule_mutation.py --engine "$RUNNER_TEMP/opengrep/opengrep" \
            --changed-files "$RUNNER_TEMP/changed.txt" --check tests/mutation-baseline.json
      - name: End-to-end
        env:
          E2E_REQUIRE: zizmor osv-scanner   # CI must not silently skip these scanners' checks
          E2E_NETWORK: "1"                  # run the checks that need the GitHub API
        run: |
          export PATH="$RUNNER_TEMP/opengrep:$(go env GOPATH)/bin:$PATH"
          bash tests/e2e.sh
      - name: Audit our own workflows and action
        run: zizmor --offline action.yml .github/workflows/
