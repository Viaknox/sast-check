name: workflow-guard

# SECURITY: this workflow runs from the base branch with pull_request_target / workflow_run and must NEVER check out
# or run PR code. It reads the PR only through the GitHub API (the script is the base branch's own copy).
# A PR that touches workflows, action.yml or the gate's settings files fails until a repo admin/maintainer or a
# CODEOWNER approves the PR's current head commit.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  # pull_request_review runs the PR's own copy of a workflow (a PR could change it), so a review event cannot run
  # the guard. workflow-guard-retrigger.yml reacts to reviews; this trigger then re-runs the guard from the base branch.
  workflow_run:
    workflows: [workflow-guard-retrigger]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: workflow-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # default ref = the base branch (pull_request_target) or the default branch (workflow_run); never the PR head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a trusted approval for protected files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
        run: python3 -I scripts/workflow_guard.py
