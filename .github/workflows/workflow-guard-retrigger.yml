name: workflow-guard-retrigger

# Does nothing itself. A review event runs this file, and its completion starts workflow-guard.yml from the base
# branch (workflow_run). A PR can edit or delete this file, but that only stops the re-check: the guard's earlier
# failure then stays in place.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "review event; workflow-guard re-checks from the base branch"
