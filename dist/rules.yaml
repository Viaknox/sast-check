- id: sast.gha.ai-prompt-injection
  languages:
  - yaml
  severity: ERROR
  message: Text that an outsider controls (issue or PR title and body, comment, review, branch name, commit message) is pasted into the inputs of an AI step. Anyone who can open an issue or comment can plant instructions that steer the model, which often has repo write access and secrets. Pass the text as untrusted data through an env var, limit the tools the agent has, and gate the job on trusted authors.
