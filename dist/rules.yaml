    sast_severity: high
    confidence: medium
    cwe: CWE-1427
    category: security
    fix: Do not interpolate event text into the prompt. Fetch it inside the agent with read-only tools, restrict permissions, and require a trusted author or label before the job runs.
    references:
    - https://cwe.mitre.org/data/definitions/1427.html
    - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
