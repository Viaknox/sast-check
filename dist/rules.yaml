- id: sast.web.inline-script-dom-xss
  languages:
  - generic
  severity: ERROR
  message: An inline script writes URL-derived data (location, document.URL, document.referrer, window.name) straight into the page via document.write or innerHTML. Anyone who can craft a link can inject script. Use textContent or sanitize the value first.
  metadata:
    sast_severity: high
    confidence: medium
    cwe: CWE-79
    category: security
    fix: Use element.textContent for plain text, or run the value through DOMPurify.sanitize() before an HTML sink.
    references:
    - https://cwe.mitre.org/data/definitions/79.html
    - https://owasp.org/www-community/attacks/DOM_Based_XSS
  paths:
    include:
    - '*.html'
    - '*.htm'
  patterns:
  - pattern-either:
    - pattern-regex: document\s*\.\s*write(ln)?\s*\([^;\n]*\b(location\s*\.\s*(hash|search|href|pathname)|document\s*\.\s*(URL|documentURI|referrer)|window\s*\.\s*name)\b
    - pattern-regex: \.\s*(innerHTML|outerHTML)\s*(\+)?=(?!=)[^;\n]*\b(location\s*\.\s*(hash|search|href|pathname)|document\s*\.\s*(URL|documentURI|referrer)|window\s*\.\s*name)\b
  - pattern-not-regex: (?:DOMPurify\s*\.\s*sanitize|escapeHtml)\s*\((?:[^;\n()]|\([^;\n()]*\))*?\b(?:location\s*\.\s*(?:hash|search|href|pathname)|document\s*\.\s*(?:URL|documentURI|referrer)|window\s*\.\s*name)\b
- id: sast.web.malicious-cdn-domain
  languages:
  - generic
  severity: ERROR
  message: This code references a CDN domain that is known to serve, or to have served, malicious code (for example polyfill.io, which started injecting malware into sites in the 2024 supply-chain incident). Remove the reference, self-host the files, or use a trusted mirror such as cdnjs or Fastly's polyfill service.
  metadata:
    sast_severity: critical
    confidence: high
    cwe: CWE-829
    category: security
